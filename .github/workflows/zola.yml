name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Refresh the Telegram feed 4x a day
    - cron: '17 2,8,14,20 * * *'

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # Fetch full history for proper git info in the site
        fetch-depth: 0

    - name: Sync Telegram feed
      env:
        TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || 'bitswords' }}
        TELEGRAM_LIMIT: "30"
      run: python3 .github/scripts/fetch_telegram.py

    - name: Commit synced posts
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add content/telegram static/telegram .github/scripts/.telegram_state.json
        if ! git diff --cached --quiet; then
          git commit -m "Sync Telegram feed [skip ci]"
          git push
        fi

    - name: Cache Zola binaries
      uses: actions/cache@v4
      with:
        path: ~/.local/share/zola
        key: zola-0.22.1

    - name: Build and deploy to gh-pages
      uses: shalzz/zola-deploy-action@v0.18.0
      env:
        # Token for pushing to gh-pages branch
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Output branch - keeps source and build artifacts separate
        OUT_DIR: public
        BUILD_FLAGS: --output-dir public
